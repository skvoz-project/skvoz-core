name: Core
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: sh -eu {0}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and export Linux and Android releases
        run: |
          docker buildx build --platform linux/amd64 --file docker/rust/Dockerfile --target artifacts \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --output "type=local,dest=$RUNNER_TEMP/core-release" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-release
          path: ${{ runner.temp }}/core-release/*
          if-no-files-found: error
  publish:
    needs: [build]
    if: github.repository == 'skvoz-project/skvoz-core' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: core-release
          path: ${{ runner.temp }}/core-release
      - name: Verify exact-commit release and publish once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/core-release
        run: |
          chmod +x "$RELEASE_DIRECTORY/skvoz-core-tools"
          timeout --signal=TERM --kill-after=10s 480s \
            "$RELEASE_DIRECTORY/skvoz-core-tools" publish "$RELEASE_DIRECTORY" "$GITHUB_SHA"
