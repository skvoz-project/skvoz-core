[package]
name = "skvoz-daemon"
version = "3.0.0"
description = "Local IPC host for the universal SKVOZ Core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
skvoz-core = { package = "skvoz-core-binding", path = "../binding", features = ["nats"] }
serde_json.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "signal"] }

[lints]
workspace = true

[[bin]]
name = "skvoz-core-daemon"
path = "main.rs"

[features]
default = []

[dev-dependencies]
skvoz-core-test-support = { path = "../test-support" }

[[example]]
name = "daemon-smoke"
harness = false
test = false

[lib]
path = "lib.rs"
