[package]
name = "skvoz-daemon"
version = "3.0.0"
description = "Local IPC host for the universal SKVOZ Core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
skvoz-core = { package = "skvoz-core-binding", path = "../binding", features = ["nats"] }
serde_json = "=1.0.151"
getrandom = "=0.4.3"
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "net", "signal"] }

[lints]
workspace = true

[[bin]]
name = "skvoz-core-daemon"
path = "src/main.rs"

[features]
default = []

[dev-dependencies]
skvoz-core-test-support = { path = "../test-support" }

[[example]]
name = "daemon-smoke"
harness = false
test = false
