[package]
name = "skvoz-core-binding"
version = "5.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
links = "skvoz_core"
build = "build.rs"

[features]
default = []
nats = []

[dependencies]
skvoz-core-contracts = { path = "../contracts", features = ["runtime", "codec"] }
serde = "=1.0.228"
serde_json = "=1.0.151"

[build-dependencies]
serde_json = "=1.0.151"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
skvoz-core-test-support = { path = "../test-support" }
tokio = { version = "=1.53.1", features = ["rt", "macros", "time"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
