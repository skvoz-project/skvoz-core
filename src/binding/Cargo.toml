[package]
name = "skvoz-core-binding"
version = "5.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
links = "skvoz_core"
build = "build.rs"

[features]
default = []
nats = []

[dependencies]
skvoz-core-contracts = { path = "../contracts", features = ["runtime", "codec"] }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
skvoz-core-test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["rt", "macros", "time"] }
futures-util = { workspace = true, default-features = false, features = ["std"] }

[lib]
path = "lib.rs"
