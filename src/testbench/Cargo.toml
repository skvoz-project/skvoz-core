[package]
name = "skvoz-testbench"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []

[dependencies]
serde_json = "=1.0.151"
skvoz-core = { path = "../core", features = ["nats"] }
async-nats = { version = "=0.50.0", default-features = false, features = ["ring"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }

[lints]
workspace = true
