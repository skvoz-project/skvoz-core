[package]
name = "skvoz-testbench"
version = "1.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []

[dependencies]
skvoz-core-test-support = { path = "../test-support" }
serde_json.workspace = true
skvoz-core = { path = "../core", features = ["nats"] }
async-nats = { workspace = true, default-features = false, features = ["ring"] }
futures-util = { workspace = true, default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }

[lints]
workspace = true

[[bin]]
name = "skvoz-testbench"
path = "main.rs"

[lib]
path = "lib.rs"
