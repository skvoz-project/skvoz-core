[package]
name = "skvoz-tcp"
version = "2.0.0"
description = "Minimal TCP socket connector embedding universal SKVOZ Core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
skvoz-core = { package = "skvoz-core-binding", path = "../../binding", features = ["nats"] }
tokio = { version = "=1.53.1", features = ["net", "io-util", "time"] }

[lints]
workspace = true

[dev-dependencies]
skvoz-core-test-support = { path = "../../test-support" }
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
